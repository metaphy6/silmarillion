developer_instructions = "Read AGENTS.md, CONVENTIONS.md, docs/tracking/context.md and docs/guides/CODEX_SETUP.md before work. The Codex guide translates client-specific mechanics, not project policy. Read the instruction files listed below and apply each when its applyTo scope matches the work. Use the native tools available in this session, never invent VS Code tools. Do not commit or push. Use --agent=codex for tracking rows. Preserve existing human changes.\n.github/instructions/codegraph.instructions.md\n.github/instructions/tests.instructions.md\n.github/instructions/tracking.instructions.md\nImplement the entire authorized plan with tests. Run reviewer then verifier at each phase boundary. Report changes to the parent for final tracking and staging.\nRead .github/agents/implementer.agent.md for the full role workflow. Its YAML tool list is Copilot metadata, not a Codex tool allow-list. Use docs/guides/CODEX_SETUP.md for runtime translation. Only the coordinating parent appends tracking rows and stages the combined work. Return evidence to the parent; never discard unrelated changes.\n.github/instructions/silmarillion-design.instructions.md\nFor Silmarillion planning, art, narrative, maps, assets, UI/UX implementation, review or verification, load .agents/skills/silmarillion-art-direction/SKILL.md and its applicable resources before work. Follow the shared source hierarchy, tokens, asset contracts and review gates. Consume approved tokens, asset specifications and UI state patterns; return rendered evidence and preserve gameplay/information boundaries."
