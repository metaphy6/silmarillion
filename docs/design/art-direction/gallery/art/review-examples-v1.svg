<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Annotated interface success and deliberate failure</title><desc id="desc">Left shows opaque readable costs, a separate hero commitment and large selection target. Right deliberately demonstrates low contrast, a tiny target, a misleading free-return claim and missing action budget separation. Right is a rejected counterexample, not usable guidance.</desc>
<rect width="1200" height="540" fill="#101C22"/>
<g font-family="Noto Sans,Arial,sans-serif" font-size="20" fill="#F2E8D5"><text x="30" y="40" fill="#B8D6A4">PASS · functional treatment</text><text x="630" y="40" fill="#FFB4A4">FAIL · deliberate counterexample</text>
<rect x="30" y="66" width="540" height="233" rx="2" fill="#192A30" stroke="#7E9699"/><text x="54" y="102">Rider Marshal · hero slot empty</text><text x="54" y="143">100P + 50M + 25K + 10E</text><text x="54" y="175">3 sequential turns · Hall excluded</text><text x="54" y="213">Operations 2 / 3 · Hero commitment 1 / 1</text><rect x="54" y="235" width="240" height="44" fill="#EDBE73"/><text x="71" y="263" fill="#14242A">Review full cost →</text>
<rect x="630" y="66" width="540" height="233" fill="#554F43"/><path d="M630 80L1170 190M630 172L1170 90M630 240L1170 160" stroke="#746B56" stroke-width="42"/><g fill="#8A806A" font-size="16"><text x="651" y="106">Return your hero for free</text><text x="651" y="142">Everything is ready</text><text x="651" y="179">Actions: 3</text></g><rect x="650" y="230" width="13" height="13" fill="#809A6C"/><text x="680" y="242" fill="#8A806A" font-size="16">tiny unlabeled target</text>
<text x="30" y="340">① Opaque surface protects contrast.</text><text x="30" y="376">② Exact chain and separate budgets.</text><text x="30" y="412">③ Review before payment; 44px action.</text><text x="30" y="463" font-size="17" fill="#B8C8C9">Small figure artwork needs its own larger target.</text>
<text x="630" y="340">① Paint competes with low-contrast text.</text><text x="630" y="376">② “Free” contradicts paid recreation.</text><text x="630" y="412">③ 13px target; merged budgets mislead.</text><text x="630" y="463" font-size="17" fill="#B8C8C9">Reject even if a reviewer calls the colors “atmospheric”.</text>
<text x="30" y="515" font-size="17" fill="#B8C8C9">Original schematic teaching example · semantic values come from tokens.json · right-hand errors are intentional.</text></g></svg>
